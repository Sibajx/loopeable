[project]
name = "loopeable"
version = "0.1.0"
description = "Orquestador de loops para dejar a Claude Code trabajando: planea, lanza loops en paralelo con agentes y subagentes, verifica, revisa e integra."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sibajx" }]
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
loopeable = "loopeable.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopeable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
