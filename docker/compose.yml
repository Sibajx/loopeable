# Uso (desde la carpeta de tu proyecto):
#   PROYECTO=$PWD docker compose -f ~/loopeable/docker/compose.yml run --rm loopeable correr
#   PROYECTO=$PWD docker compose -f ~/loopeable/docker/compose.yml run --rm loopeable estado
services:
  loopeable:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: loopeable:local
    user: "0"                       # entrada.sh arranca el firewall y luego baja a un usuario sin privilegios
    cap_add: [NET_ADMIN, NET_RAW]   # solo para el firewall
    volumes:
      - ${PROYECTO:?define PROYECTO con la ruta del repo}:/trabajo
    environment:
      LOOPEABLE_FIREWALL: "1"
      LOOPEABLE_DOMINIOS_EXTRA: ${LOOPEABLE_DOMINIOS_EXTRA:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    # Secretos de avisos (p. ej. el token de Telegram) en un archivo aparte, no en `environment`: entrada.sh los
    # saca del entorno y se los pasa a loopeable por un descriptor, para que los agentes no los vean.
    env_file:
      - path: ${LOOPEABLE_AVISOS_ENV:-/dev/null}
        required: false
    # Sin acceso a tu $HOME, ~/.ssh ni a otros proyectos: solo lo que se monta arriba.
